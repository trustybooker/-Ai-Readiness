[build]
  publish = "."
  command = "npm run validate"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_SITE_URL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Block internal source, docs, tests, and config from being served as static
# files (publish = "." exposes the repo root). Function bundles keep their own
# copies of lib/, so the serverless endpoints are unaffected. These come first
# so they take precedence over any other rule.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/course/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/lib/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Explicit public API aliases used by the site, launch smoke tests, and channels.
# Keep these before the /api/* deny rule so only approved functions are exposed.
[[redirects]]
  from = "/api/capture-lead"
  to = "/.netlify/functions/capture-lead"
  status = 200
  force = true

[[redirects]]
