[build]
  publish = "."
  command = "npm run validate"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_SITE_URL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/owner*"
  [headers.values]
    Cache-Control = "no-store, private"
    X-Robots-Tag = "noindex, nofollow, noarchive"

# One public canonical origin. These host redirects stack with rel=canonical and the sitemap.
[[redirects]]
  from = "https://aikollege.com/*"
  to = "https://www.aikollege.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://ai-readiness-pass.netlify.app/*"
  to = "https://www.aikollege.com/:splat"
  status = 301
  force = true

[[redirects]]
