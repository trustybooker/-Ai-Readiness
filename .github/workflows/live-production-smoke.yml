name: Live AI Kollege production smoke

on:
  workflow_dispatch:
  push:
    branches:
      - release/ai-kollege-launch
    paths:
      - .github/workflows/live-production-smoke.yml

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE_URL: https://ai-readiness-pass.netlify.app
      CUSTOM_DOMAIN: https://aikollege.com
      LEADS_REPO: trustybooker/-Ai-Readiness
      LEADS_SECRET: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for and inspect live production
        run: node scripts/live-production-smoke.mjs
      - name: Prove first-party lead capture and clean up test issue
        run: node scripts/live-lead-test.mjs
