name: Live AI Kollege production smoke

on:
  push:
    branches: [release/ai-kollege-launch]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-kollege-live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SITE_URL: https://www.aikollege.com
      APEX_URL: https://aikollege.com
      NETLIFY_URL: https://ai-readiness-pass.netlify.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for and inspect canonical live production
        run: node scripts/live-production-smoke.mjs
