name: Normalize canonical www URLs

on:
  push:
    branches: [audit/conversion-impact-pass]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-normalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/conversion-impact-pass
      - name: Normalize production origin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = [Path(p) for p in [
            'index.html','booking.html','answers.html','checklist.html','checklist-start.html','lab.html','content-engine.html','courses.html','badge.html','refunds.html','privacy.html','purchase-success.html','thanks.html'
          ]]
          targets += sorted(Path('answer').glob('*.html'))
          old='https://aikollege.com/'
          new='https://www.aikollege.com/'
          changed=[]
          for p in targets:
            if not p.exists(): continue
            s=p.read_text()
            if old in s:
              p.write_text(s.replace(old,new))
              changed.append(str(p))
          print('normalized:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit normalized public URLs
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html booking.html answers.html checklist.html checklist-start.html lab.html content-engine.html courses.html badge.html refunds.html privacy.html purchase-success.html thanks.html answer/*.html
          git commit -m "Normalize production canonicals to www [canonical-normalized]"
          git push origin HEAD:audit/conversion-impact-pass
