name: Validate AI Readiness Pass

on:
  push:
    branches: [main, build/ai-readiness-pass, release/ai-kollege-launch]
  pull_request:
    branches: [main, release/ai-kollege-launch]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Run tests, wiring, SEO and security validation
        run: npm run check
