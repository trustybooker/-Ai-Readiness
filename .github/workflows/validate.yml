name: Validate AI Readiness Pass

on:
  push:
    branches: [main, build/ai-readiness-pass, release/ai-kollege-launch]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests and static validation
        run: npm run check
