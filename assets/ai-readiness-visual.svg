<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
  <title id="title">AI Readiness Pass visual system</title>
  <desc id="desc">A vector dashboard showing score, path, human review, safe use, and implementation workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e5bb5"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="920" height="620" rx="44" fill="url(#bg)"/>
  <circle cx="792" cy="82" r="148" fill="#bfdbfe" opacity="0.36"/>
  <circle cx="106" cy="528" r="128" fill="#fed7aa" opacity="0.42"/>

  <g filter="url(#shadow)">
    <rect x="78" y="70" width="764" height="480" rx="34" fill="#ffffff" stroke="#dbe4f0"/>
    <rect x="78" y="70" width="764" height="74" rx="34" fill="#0f172a"/>
    <circle cx="126" cy="108" r="10" fill="#f97316"/>
    <circle cx="158" cy="108" r="10" fill="#f59e0b"/>
    <circle cx="190" cy="108" r="10" fill="#22c55e"/>
    <text x="240" y="116" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">AI Readiness Command View</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="116" y="184" width="222" height="250" rx="28" fill="#f8fafc" stroke="#dbe4f0"/>
    <text x="146" y="232" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#0f172a">Readiness Score</text>
    <circle cx="226" cy="326" r="72" fill="none" stroke="#e2e8f0" stroke-width="18"/>
    <path d="M154 326a72 72 0 0 1 132-40" fill="none" stroke="url(#blue)" stroke-width="18" stroke-linecap="round"/>
    <text x="196" y="336" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="950" fill="#2563eb">76</text>
    <text x="184" y="382" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#64748b">human review</text>
  </g>

  <g>
    <rect x="386" y="184" width="418" height="70" rx="22" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="424" cy="219" r="16" fill="url(#blue)"/>
    <path d="M416 219l6 7 12-15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="456" y="213" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#0f172a">Score routes to the right path</text>
    <text x="456" y="235" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#475569">starter, job prep, audit, sprint, or implementation review</text>

    <rect x="386" y="278" width="418" height="70" rx="22" fill="#fff7ed" stroke="#fed7aa"/>
    <circle cx="424" cy="313" r="16" fill="#f59e0b"/>
    <path d="M424 302v22M413 313h22" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="456" y="307" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#0f172a">Human checkpoint before decisions</text>
    <text x="456" y="329" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#475569">no fake guarantees, no uncontrolled automation</text>

    <rect x="386" y="372" width="418" height="70" rx="22" fill="#ecfdf5" stroke="#bbf7d0"/>
    <circle cx="424" cy="407" r="16" fill="#22c55e"/>
    <path d="M416 407l6 7 12-15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="456" y="401" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#0f172a">Proof-of-work implementation</text>
    <text x="456" y="423" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#475569">worksheets, review, booking, and delivery workflow</text>
  </g>

  <g transform="translate(119 468)">
    <rect width="685" height="40" rx="20" fill="#0f172a" opacity="0.96"/>
    <text x="32" y="26" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" fill="#ffffff">AI literacy</text>
    <text x="158" y="26" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" fill="#ffffff">privacy</text>
    <text x="270" y="26" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" fill="#ffffff">job proof</text>
    <text x="398" y="26" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" fill="#ffffff">business audit</text>
    <text x="558" y="26" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" fill="#ffffff">training</text>
  </g>
</svg>
